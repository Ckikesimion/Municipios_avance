<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plataforma de Mapas de Avance</title>
    <style>
        /* === DISEÑO GENERAL === */
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            background-color: #f4f4f9;
            overflow: hidden;
        }
        
        header { 
            background-color: #2c3e50; 
            color: white; 
            padding: 1rem; 
            text-align: center; 
            flex-shrink: 0; /* Evita que la cabecera se encoja */
        }
        header h1 {
            margin: 0;
            font-size: 1.6rem;
        }
        
        /* === CONTENEDOR DE SELECTORES === */
        #controles { 
            background: white; 
            padding: 15px 20px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 20px; 
            justify-content: center; 
            border-bottom: 1px solid #ddd; 
            align-items: flex-end;
            flex-shrink: 0; /* Evita que los controles se encojan */
        }

        .grupo-seleccion { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
        }
        
        label { 
            font-size: 0.8rem; 
            font-weight: bold; 
            color: #555; 
            text-transform: uppercase; 
        }

        select {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: #fff;
            font-size: 1rem;
            min-width: 160px;
            cursor: pointer;
            outline: none;
        }

        #btn-limpiar {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 11px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        #btn-limpiar:hover { background-color: #d32f2f; }

        /* === VISOR DE MAPA (Corrección de franja blanca) === */
        #contenedor-mapa { 
            flex-grow: 1; 
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #ffffff;
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block;
        }
        
        .mensaje-inicio { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            color: #7f8c8d; 
            text-align: center; 
            width: 80%;
        }

        .oculto { display: none !important; }

        /* === AJUSTES PARA CELULARES === */
        @media (max-width: 768px) {
            header h1 { font-size: 1.2rem; }

            #controles {
                padding: 10px;
                gap: 10px;
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            select {
                width: 100%;
                min-width: unset;
                font-size: 0.9rem;
                padding: 8px;
            }

            #btn-limpiar {
                grid-column: span 2;
                width: 100%;
                padding: 10px;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>Visualizador de Avance Físico y Financiero</h1>
</header>

<div id="controles">
    <div class="grupo-seleccion">
        <label for="select-año">Seleccione Año</label>
        <select id="select-año" onchange="actualizarInterfaz()">
            <option value="">-- Elegir Año --</option>
            <option value="2025">2025</option>
            <option value="2026">2026</option>
            <option value="2027">2027</option>
            <option value="2028">2028</option>
        </select>
    </div>

    <div id="div-cuatri" class="grupo-seleccion oculto">
        <label for="select-cuatri">Cuatrimestre</label>
        <select id="select-cuatri" onchange="actualizarInterfaz()">
            <option value="">-- Elegir Cuatrimestre --</option>
            <option value="c1">Cuatrimestre 1 (C1)</option>
            <option value="c2">Cuatrimestre 2 (C2)</option>
            <option value="c3">Cuatrimestre 3 (C3)</option>
        </select>
    </div>

    <div id="div-avance" class="grupo-seleccion oculto">
        <label for="select-avance">Tipo de Avance</label>
        <select id="select-avance" onchange="cargarMapa()">
            <option value="">-- Elegir Avance --</option>
            <option value="fisico">Avance Físico</option>
            <option value="financiero">Avance Financiero</option>
        </select>
    </div>

    <button type="button" id="btn-limpiar" onclick="limpiarFiltros()">
        Limpiar Filtros
    </button>
</div>
<div id="contenedor-mapa">
    <div id="mensaje" class="mensaje-inicio" style="top: 35%;">
        <h3 style="font-size: 50px; margin: 0 0 10px 0;" >Bienvenido</h3>
        <p style="font-size: 50px; margin: 5px 0 0 0;">Utilice los menús superiores para filtrar y visualizar los mapas correspondientes.</p>
    </div>
    <iframe id="visor" src=""></iframe>
</div>

<script>
    function actualizarInterfaz() {
        const año = document.getElementById('select-año').value;
        const cuatri = document.getElementById('select-cuatri').value;
        const divCuatri = document.getElementById('div-cuatri');
        const divAvance = document.getElementById('div-avance');
        const visor = document.getElementById('visor');
        const mensaje = document.getElementById('mensaje');

        visor.src = "";
        mensaje.classList.remove('oculto');

        if (año !== "") {
            divCuatri.classList.remove('oculto');
        } else {
            divCuatri.classList.add('oculto');
            divAvance.classList.add('oculto');
            return;
        }

        if (cuatri !== "") {
            divAvance.classList.remove('oculto');
        } else {
            divAvance.classList.add('oculto');
        }
    }

    function cargarMapa() {
        const año = document.getElementById('select-año').value;
        const cuatri = document.getElementById('select-cuatri').value;
        const avance = document.getElementById('select-avance').value;
        
        if (año && cuatri && avance) {
            document.getElementById('mensaje').classList.add('oculto');
            const carpeta = `${año}/${cuatri}/${avance}`;
            const ruta = `mapas/${carpeta}/index.html`;
            document.getElementById('visor').src = ruta;
        }
    }

    function limpiarFiltros() {
        document.getElementById("select-año").value = "";
        document.getElementById("select-cuatri").value = "";
        document.getElementById("select-avance").value = "";
        document.getElementById("div-cuatri").classList.add("oculto");
        document.getElementById("div-avance").classList.add("oculto");
        const visor = document.getElementById("visor");
        if (visor) { visor.src = ""; }
        const mensaje = document.getElementById("mensaje");
        if (mensaje) { mensaje.classList.remove("oculto"); }
    }  
</script>
</body>
</html>
