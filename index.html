<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Mapas de Avance</title>
    <style>
        /* === DISEÑO GENERAL === */
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            background-color: #f4f4f9; 
        }
        
        header { 
            background-color: #2c3e50; 
            color: white; 
            padding: 1rem; 
            text-align: center; 
        }
        header h1 {
            margin: 0;
            font-size: 1.8rem;
        }
        
        /* === CONTENEDOR DE SELECTORES (Flexbox Inteligente) === */
        #controles { 
            background: white; 
            padding: 15px 20px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 20px; 
            justify-content: center; 
            border-bottom: 1px solid #ddd; 
            align-items: flex-end;
            position: relative;
        }

        .grupo-seleccion { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
        }
        
        label { 
            font-size: 0.8rem; 
            font-weight: bold; 
            color: #555; 
            text-transform: uppercase; 
        }

        /* === MENÚS DESPLEGABLES === */
        select {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: #fff;
            font-size: 1rem;
            min-width: 160px;
            cursor: pointer;
            outline: none;
            transition: border-color 0.3s;
        }
        select:focus { border-color: #3498db; }

        /* === BOTÓN LIMPIAR FILTROS (Solución de posición en PC) === */
        #btn-limpiar {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 11px 15px; /* Ajustado para que mida lo mismo que los selects */
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        #btn-limpiar:hover {
            background-color: #d32f2f;
        }

        /* === VISOR DE MAPA === */
        #contenedor-mapa { 
            flex-grow: 1; 
            position: relative; 
            width: 100%;
            height: 100%;
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block;
        }
        
        .mensaje-inicio { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            color: #7f8c8d; 
            text-align: center; 
            width: 80%;
        }

        .oculto { display: none !important; }

        /* ========================================================
           === REGLAS EXCLUSIVAS PARA DISPOSITIVOS MÓVILES ===
           ======================================================== */
        @media (max-width: 768px) {
            header {
                padding: 0.8rem;
            }
            header h1 {
                font-size: 1.2rem; /* Título más pequeño para que no ocupe 3 líneas */
            }

            #controles {
                padding: 12px;
                gap: 12px;
                /* Usamos Grid en móvil para que los elementos se organicen simétricamente */
                display: grid;
                grid-template-columns: 1fr 1fr; /* Dos columnas iguales */
                align-items: end;
            }

            .grupo-seleccion {
                width: 100%;
            }

            select {
                width: 100%; /* El select se adapta al ancho de su columna grid */
                min-width: unset;
                font-size: 0.9rem;
                padding: 8px;
            }

            /* Hacemos que el botón de limpiar ocupe todo el ancho inferior abajo de los selectores */
            #btn-limpiar {
                grid-column: span 2; /* Se estira a lo ancho de las 2 columnas */
                width: 100%;
                padding: 10px;
                font-size: 13px;
                text-align: center;
            }
            
            .mensaje-inicio h3 {
                font-size: 1.1rem;
            }
            .mensaje-inicio p {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>Visualizador de Avance Físico y Financiero</h1>
</header>

<div id="controles">
    <div class="grupo-seleccion">
        <label for="select-año">Seleccione Año</label>
        <select id="select-año" onchange="actualizarInterfaz()">
            <option value="">-- Elegir Año --</option>
            <option value="2025">2025</option>
            <option value="2026">2026</option>
            <option value="2027">2027</option>
            <option value="2028">2028</option>
        </select>
    </div>

    <div id="div-cuatri" class="grupo-seleccion oculto">
        <label for="select-cuatri">Cuatrimestre</label>
        <select id="select-cuatri" onchange="actualizarInterfaz()">
            <option value="">-- Elegir Cuatrimestre --</option>
            <option value="c1">Cuatrimestre 1 (C1)</option>
            <option value="c2">Cuatrimestre 2 (C2)</option>
            <option value="c3">Cuatrimestre 3 (C3)</option>
        </select>
    </div>

    <div id="div-avance" class="grupo-seleccion oculto">
        <label for="select-avance">Tipo de Avance</label>
        <select id="select-avance" onchange="cargarMapa()">
            <option value="">-- Elegir Avance --</option>
            <option value="fisico">Avance Físico</option>
            <option value="financiero">Avance Financiero</option>
        </select>
    </div>

    <button type="button" id="btn-limpiar" onclick="limpiarFiltros()">
        Limpiar Filtros
    </button>
</div>

<div id="contenedor-mapa">
    <div id="mensaje" class="mensaje-inicio">
        <h3>Bienvenido</h3>
        <p>Utilice los menús superiores para filtrar y visualizar los mapas correspondientes.</p>
    </div>
    <iframe id="visor" src=""></iframe>
</div>

<script>
    function actualizarInterfaz() {
        const año = document.getElementById('select-año').value;
        const cuatri = document.getElementById('select-cuatri').value;
        
        const divCuatri = document.getElementById('div-cuatri');
        const divAvance = document.getElementById('div-avance');
        const visor = document.getElementById('visor');
        const mensaje = document.getElementById('mensaje');

        // Resetear visor si algo cambia
        visor.src = "";
        mensaje.classList.remove('oculto');

        // Lógica de cascada
        if (año !== "") {
            divCuatri.classList.remove('oculto');
        } else {
            divCuatri.classList.add('oculto');
            divAvance.classList.add('oculto');
            return;
        }

        if (cuatri !== "") {
            divAvance.classList.remove('oculto');
        } else {
            divAvance.classList.add('oculto');
        }
    }

    function cargarMapa() {
        const año = document.getElementById('select-año').value;
        const cuatri = document.getElementById('select-cuatri').value;
        const avance = document.getElementById('select-avance').value;
        
        if (año && cuatri && avance) {
            document.getElementById('mensaje').classList.add('oculto');
            
            // Ruta: mapas/2024/c1/fisico/index.html
            const carpeta = `${año}/${cuatri}/${avance}`;
            const ruta = `mapas/${carpeta}/index.html`;
            
            console.log("Cargando mapa desde:", ruta); // Para depuración
            document.getElementById('visor').src = ruta;
        }
    }

    function limpiarFiltros() {
        // 1. Reiniciamos los valores de los selectores a vacío ("")
        document.getElementById("select-año").value = "";
        document.getElementById("select-cuatri").value = "";
        document.getElementById("select-avance").value = "";

        // 2. Ocultamos las secciones de cuatrimestre y avance para reiniciar el flujo
        document.getElementById("div-cuatri").classList.add("oculto");
        document.getElementById("div-avance").classList.add("oculto");

        // 3. Limpiamos el mapa (el visor) para que la pantalla vuelva a estar blanca
        const visor = document.getElementById("visor");
        if (visor) {
            visor.src = ""; 
        }

        // 4. Mostramos el mensaje inicial de "Seleccione los filtros"
        const mensaje = document.getElementById("mensaje");
        if (mensaje) {
            mensaje.classList.remove("oculto");
        }

        console.log("Interfaz reiniciada correctamente");
    }  
</script>

</body>
</html>
