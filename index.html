<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Mapas de Avance</title>
    <style>
        /* Diseño General */
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background-color: #f4f4f9; }
        header { background-color: #2c3e50; color: white; padding: 1rem; text-align: center; }
        
        /* Contenedor de Selectores */
        #controles { 
            background: white; 
            padding: 15px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 30px; 
            justify-content: center; 
            border-bottom: 1px solid #ddd; 
            align-items: flex-end;
        }

        .grupo-seleccion { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.8rem; font-weight: bold; color: #555; text-transform: uppercase; }

        /* Estilo de los Menús Desplegables */
        select {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: #fff;
            font-size: 1rem;
            min-width: 150px;
            cursor: pointer;
            outline: none;
        }

        select:focus { border-color: #3498db; }

        /* Visor de Mapa */
        #contenedor-mapa { flex-grow: 1; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        
        .mensaje-inicio { 
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            color: #7f8c8d; text-align: center; 
            width: 80%;
        }

        .oculto { display: none; }
    </style>
</head>
<body>

<header>
    <h1>Visualizador de Avance Físico y Financiero</h1>
</header>

<div id="controles">
    <!-- Selector de Año -->
    <div class="grupo-seleccion">
        <label for="select-año">Seleccione Año</label>
        <select id="select-año" onchange="actualizarInterfaz()">
            <option value="">-- Elegir Año --</option>
            /* <option value="2023">2023</option> */
            <option value="2024">2024</option>
            <option value="2025">2025</option>
            <option value="2026">2026</option>
            <option value="2027">2027</option>
            <option value="2028">2028</option>
        </select>
    </div>

    <!-- Selector de Cuatrimestre -->
    <div id="div-cuatri" class="grupo-seleccion oculto">
        <label for="select-cuatri">Cuatrimestre</label>
        <select id="select-cuatri" onchange="actualizarInterfaz()">
            <option value="">-- Elegir Cuatrimestre --</option>
            <option value="c1">Cuatrimestre 1 (C1)</option>
            <option value="c2">Cuatrimestre 2 (C2)</option>
            <option value="c3">Cuatrimestre 3 (C3)</option>
        </select>
    </div>

    <!-- Selector de Tipo de Avance -->
    <div id="div-avance" class="grupo-seleccion oculto">
        <label for="select-avance">Tipo de Avance</label>
        <select id="select-avance" onchange="cargarMapa()">
            <option value="">-- Elegir Avance --</option>
            <option value="fisico">Avance Físico</option>
            <option value="financiero">Avance Financiero</option>
        </select>
    </div>
</div>

<div id="contenedor-mapa">
    <div id="mensaje" class="mensaje-inicio">
        <h3>Bienvenido</h3>
        <p>Utilice los menús superiores para filtrar y visualizar los mapas correspondientes.</p>
    </div>
    <iframe id="visor" src=""></iframe>
</div>

<script>
    function actualizarInterfaz() {
        const año = document.getElementById('select-año').value;
        const cuatri = document.getElementById('select-cuatri').value;
        
        const divCuatri = document.getElementById('div-cuatri');
        const divAvance = document.getElementById('div-avance');
        const visor = document.getElementById('visor');
        const mensaje = document.getElementById('mensaje');

        // Resetear visor si algo cambia
        visor.src = "";
        mensaje.classList.remove('oculto');

        // Lógica de cascada
        if (año !== "") {
            divCuatri.classList.remove('oculto');
        } else {
            divCuatri.classList.add('oculto');
            divAvance.classList.add('oculto');
            return;
        }

        if (cuatri !== "") {
            divAvance.classList.remove('oculto');
        } else {
            divAvance.classList.add('oculto');
        }
    }

    function cargarMapa() {
        const año = document.getElementById('select-año').value;
        const cuatri = document.getElementById('select-cuatri').value;
        const avance = document.getElementById('select-avance').value;
        
        if (año && cuatri && avance) {
            document.getElementById('mensaje').classList.add('oculto');
            
            // Ruta: mapas/2024/c1/fisico/index.html
            const carpeta = `${año}/${cuatri}/${avance}`;
            const ruta = `mapas/${carpeta}/index.html`;
            
            console.log("Cargando mapa desde:", ruta); // Para depuración
            document.getElementById('visor').src = ruta;
        }
    }
</script>

</body>
</html>
